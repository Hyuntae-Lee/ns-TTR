<!doctype html>
<!-- The MAP: a Streamlit custom component (see void_editor_component() / render_map() in app.py).

     Fixed frame (no zoom / pan) laid out at a 1:1 aspect: the whole rod depth, the copper (|r| <= R) in the
     middle of the grey silica.  It shows
       * the void being set up ("pending" geometry) as a shape that can be moved and resized with the mouse,
         and its four numbers as editable fields in the card above the map; a drag or a typed value posts
         {seq, rc, rh, depth, thick} [μm] back to Streamlit, which stores it as the new geometry;
       * once a result exists (args.result): its temperature snapshots as a heatmap over the copper, with a
         time slider (and ← / → while the map has the focus), and the void that was actually computed as a
         dashed outline — visible as soon as the pending void differs from it, i.e. the result is outdated.
     Talks to Streamlit through the plain postMessage protocol, so no build step is needed.

     Mouse handling is done here, not by Plotly's editable-shapes mode: the void's bounding box (enlarged to
     at least MIN_HIT px, so a few-px-thick void is still grabbable) is split into a 3 x 3 grid — the centre
     cell moves the void, the outer cells drag the corresponding edge(s).

     The geometry is clamped / rounded here exactly like apply_void_from_editor() in app.py, so the figure
     and the stored values agree; args carrying an older `applied_seq` than the last value sent are ignored
     for the geometry. -->
<html>
<head>
<meta charset="utf-8">
<script src="plotly.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #ffffff; }
  body { font: 14px/1.5 "Source Sans Pro", "Source Sans", "Segoe UI", "Malgun Gothic", sans-serif; color: #31333f; }
  #plot { width: 100%; outline: none; }
  /* snapshot selector (only with a result) */
  #timebar { display: flex; align-items: center; gap: 14px; padding: 0 10px 8px 60px; }
  #timebar[hidden] { display: none; }
  #tlabel { white-space: nowrap; min-width: 15em; font-variant-numeric: tabular-nums; }
  #tlabel b { font-weight: 600; }
  #tslider { flex: 1; accent-color: #d62728; }
  /* Void 형상 card above the map, left-aligned with the plot area (= layout margin.l); the frame height
     follows it (see fitFrame) */
  #info { padding: 16px 10px 10px 60px; display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  #info .sec { border: 1px solid #e3e6ec; border-radius: 8px; background: #f7f8fa; padding: 6px 12px 8px 12px; }
  #info .sec-h { font-weight: 700; font-size: 12px; color: #d62728; letter-spacing: 0.02em; margin-bottom: 4px; }
  /* two pairs per row on a shared grid (label | input | unit, twice), so the second row lines up under the
     first — 두께 under 깊이, 반경 반폭 under 축에서 벗어난 거리 — and nothing shifts as the values change */
  #info .grid { display: grid; grid-template-columns: auto auto auto auto auto auto; row-gap: 4px;
                align-items: center; justify-content: start; }
  #info .k { color: #6b7280; margin-right: 6px; white-space: nowrap; }
  #info .k.second { margin-left: 26px; }                               /* gap between the two pairs */
  #info .u { color: #6b7280; margin-left: 4px; }
  #infotext .txt { max-width: 900px; line-height: 1.45; }
  #info input { width: 5.6em; box-sizing: border-box; padding: 2px 6px; border: 1px solid #d5d9e0; border-radius: 6px;
                background: #ffffff; color: #31333f; font: inherit; font-weight: 600; text-align: right;
                font-variant-numeric: tabular-nums; }
  #info input:focus { outline: none; border-color: #d62728; box-shadow: 0 0 0 1px #d62728; }
  #info input::-webkit-outer-spin-button, #info input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  /* cursor for the zone under the mouse (overrides Plotly's own cursor classes on the drag layer) */
  .cur-move, .cur-move * { cursor: move !important; }
  .cur-ew, .cur-ew * { cursor: ew-resize !important; }
  .cur-ns, .cur-ns * { cursor: ns-resize !important; }
  .cur-nwse, .cur-nwse * { cursor: nwse-resize !important; }
  .cur-nesw, .cur-nesw * { cursor: nesw-resize !important; }
</style>
</head>
<body>
<div id="info"></div>
<div id="plot" tabindex="0"></div>
<div id="timebar" hidden><span id="tlabel"></span><input id="tslider" type="range" min="0" max="0" step="1" value="0"></div>
<script>
(function () {
  const MIN_HIT = 30;                    // px: minimum width / height of the grab area around the void
  const VOID = 2;                        // index of the pending (draggable) void in layout.shapes, see render()
  const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  const gd = document.getElementById("plot"), info = document.getElementById("info");
  const timebar = document.getElementById("timebar"), tlabel = document.getElementById("tlabel"), tslider = document.getElementById("tslider");
  let args = null, ready = false;
  let sentSeq = 0;                       // seq of the last value posted to Streamlit (0 = none yet)
  // Pending void geometry {rc, rh, depth, thick} [μm].  rc is SIGNED here (the ellipse may be drawn on either
  // side of the axis, so nothing jumps while dragging); the model only uses the distance |rc| — the pump is
  // axisymmetric — so Streamlit receives |rc| and `side` remembers which side to draw it on.
  let geom = null, side = 1;
  let drag = null;                       // active drag: {zone, x, y, g0}
  let editable = true;                   // false for a random arrangement (static_voids): no drag, no fields
  // Decoded temperature snapshots of the current result (decoded once per result key) and the shown one.
  let frames = null, framesKey = null, cur = 0;

  const r3 = x => Math.round(x * 1000) / 1000;

  function clamp(g, a) {
    const thick = Math.min(Math.max(g.thick, a.min_size), a.L);
    return {
      depth: r3(Math.min(Math.max(g.depth, 0), a.L - thick)),
      thick: r3(thick),
      rc: r3(Math.sign(g.rc) * Math.min(Math.abs(g.rc), a.rc_max)),
      rh: r3(Math.min(Math.max(g.rh, a.min_size), a.r_max)),
    };
  }
  const KEYS = ["rc", "rh", "depth", "thick"];
  const same = (p, q) => p && q && KEYS.every(k => Math.abs(p[k] - q[k]) < 1e-9);
  const sameDistance = (p, q) => p && q && KEYS.every(k => Math.abs(Math.abs(p[k]) - Math.abs(q[k])) < 1e-9);

  function ellipse(g, style) {
    return Object.assign({ type: "circle", xref: "x", yref: "y",
                           x0: g.rc - g.rh, x1: g.rc + g.rh, y0: g.depth, y1: g.depth + g.thick }, style);
  }
  // relayout update for the pending void.  NB: {"shapes[i]": {...}} would INSERT a new shape at index i
  // (Plotly's array-container semantics) and leave the old one behind; attribute paths update in place.
  function shapeUpdate(g) {
    const p = "shapes[" + VOID + "].";
    const u = {};
    u[p + "x0"] = g.rc - g.rh; u[p + "x1"] = g.rc + g.rh; u[p + "y0"] = g.depth; u[p + "y1"] = g.depth + g.thick;
    return u;
  }

  // ---- Void 형상 card: the four values as editable fields ------------------------------------------------
  // Row-major on the 2-pair grid: [geometry key, label].  "rc" is shown (and typed) as the distance |rc|.
  const FIELDS = [["depth", "깊이 (윗면 z)"], ["rc", "축에서 벗어난 거리"], ["thick", "두께"], ["rh", "반경 반폭"]];
  const inputs = {};
  (function buildCard() {
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
    const box = el("div", "sec"), grid = el("div", "grid");
    box.appendChild(el("div", "sec-h", "Void 형상"));
    FIELDS.forEach(function (f, i) {
      const inp = el("input");
      inp.type = "number"; inp.step = "any"; inp.setAttribute("aria-label", f[1] + " [μm]");
      inp.addEventListener("change", commitFields);            // Enter or leaving the field
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") inp.blur(); });
      inp.addEventListener("blur", function () { if (geom) showInfo(geom); });   // "5" -> "5.000" even if unchanged
      inputs[f[0]] = inp;
      grid.append(el("span", "k" + (i % 2 ? " second" : ""), f[1]), inp, el("span", "u", "μm"));
    });
    box.appendChild(grid);
    info.appendChild(box);
    const txt = el("div", "sec");
    txt.id = "infotext";
    txt.appendChild(el("div", "sec-h", "Void 배치"));
    txt.appendChild(el("div", "txt"));
    txt.style.display = "none";
    info.appendChild(txt);
  })();

  function fitFrame() {
    send("streamlit:setFrameHeight", { height: args.height + timebar.offsetHeight + info.offsetHeight });
  }

  // Show a geometry in the fields (3 decimals).  A field being typed in is left alone.
  function showInfo(g) {
    const txt = document.getElementById("infotext");
    txt.style.display = args.info_text ? "" : "none";
    txt.querySelector(".txt").textContent = args.info_text || "";
    info.firstChild.style.display = args.info_text ? "none" : "";   // the fields card
    FIELDS.forEach(function (f) {
      const inp = inputs[f[0]];
      if (document.activeElement !== inp) inp.value = (f[0] === "rc" ? Math.abs(g.rc) : g[f[0]]).toFixed(3);
    });
    fitFrame();
  }

  // The pending void changed (drag or typed): redraw it, show the clamped values, tell Streamlit.
  function setGeometry(g) {
    geom = g;
    if (g.rc !== 0) side = Math.sign(g.rc);
    Plotly.relayout(gd, shapeUpdate(g));
    showInfo(g);
    sentSeq = Date.now();                                    // unique per change, also across iframe reloads
    send("streamlit:setComponentValue", { value: Object.assign({ seq: sentSeq }, g, { rc: Math.abs(g.rc) }), dataType: "json" });
  }

  function commitFields() {
    if (!args || !geom) return;
    const val = k => { const x = parseFloat(inputs[k].value); return isFinite(x) ? x : (k === "rc" ? Math.abs(geom.rc) : geom[k]); };
    const g = clamp({ rc: side * Math.abs(val("rc")), rh: val("rh"), depth: val("depth"), thick: val("thick") }, args);
    if (document.activeElement && document.activeElement.tagName === "INPUT") document.activeElement.blur();
    if (same(g, geom)) { showInfo(geom); return; }             // nothing changed (or clamped back): just tidy the text
    setGeometry(g);
  }

  // ---- temperature snapshots -----------------------------------------------------------------------------
  // result.data: base64 of little-endian uint16, frames x nz x nx, value = ΔT / zmax * 65535.
  function decode(res) {
    const bin = atob(res.data), nx = res.x.length, nz = res.z.length, scale = res.zmax / 65535, out = [];
    let p = 0;
    for (let f = 0; f < res.n; f++) {
      const rows = new Array(nz);
      for (let j = 0; j < nz; j++) {
        const row = new Float32Array(nx);
        for (let i = 0; i < nx; i++, p += 2) row[i] = (bin.charCodeAt(p) | (bin.charCodeAt(p + 1) << 8)) * scale;
        rows[j] = row;
      }
      out.push(rows);
    }
    return out;
  }

  function showTime() {
    const res = args.result;
    const b = document.createElement("b");
    b.textContent = res.t[cur] + " " + res.tunit;
    tlabel.replaceChildren("스냅샷 t = ", b, "  (" + (cur + 1) + " / " + res.n + ")");
  }

  function setFrame(k) {
    const res = args && args.result;
    if (!res || !frames) return;
    k = Math.min(res.n - 1, Math.max(0, k));
    if (k === cur) return;
    cur = k;
    tslider.value = String(k);
    showTime();
    Plotly.restyle(gd, { z: [frames[k]] }, [0]);
  }

  // ---- figure --------------------------------------------------------------------------------------------
  function render() {
    const a = args, R = a.R, L = a.L, res = a.result || null;
    if (res && res.key !== framesKey) { frames = decode(res); framesKey = res.key; cur = res.init; }
    if (!res) { frames = null; framesKey = null; }
    const runVoid = res && res.void && !a.static_voids ? res.void : null;   // the void the shown temperatures were computed with
    editable = !a.static_voids;                              // a random arrangement is display-only
    // Pending geometry from the args, unless they predate the last value we sent (then keep the dragged shape).
    if (geom === null || a.applied_seq >= sentSeq) {
      const g = { rc: a.rc, rh: a.rh, depth: a.depth, thick: a.thick };
      if (runVoid && sameDistance(g, runVoid)) side = 1;     // unchanged since the run: draw it where the heat map has it
      geom = { rc: side * g.rc, rh: g.rh, depth: g.depth, thick: g.thick };
    }
    const data = res ? [{
      type: "heatmap", x: res.x, y: res.z, z: frames[cur], colorscale: a.colorscale, zmin: 0, zmax: res.zmax, zauto: false,
      colorbar: { title: { text: "ΔT [K]" }, thickness: 12, len: 0.9 },
      hovertemplate: "r=%{x:.2f} μm<br>z=%{y:.2f} μm<br>ΔT=%{z:.4g} K<extra></extra>",
    }] : [];
    const layout = {
      xaxis: { title: "r [μm]", range: [-R, R], constrain: "range", fixedrange: true, zeroline: false },
      yaxis: { title: "z (깊이) [μm]", range: [L, 0], scaleanchor: "x", scaleratio: 1, constrain: "range", fixedrange: true },
      // shapes[0]: copper at rest (navy = the map's ΔT = 0 colour), under the heatmap
      // shapes[1]: the computed void (dashed) — coincides with the pending one until the void is changed
      // shapes[VOID = 2]: the pending void, the only interactive element
      shapes: [
        { type: "rect", xref: "x", yref: "y", x0: -R, x1: R, y0: 0, y1: L, layer: "below",
          fillcolor: "#141466", line: { width: 0 } },
        ellipse(runVoid || { rc: 0, rh: 1, depth: 0, thick: 1 },
                { visible: !!runVoid, line: { color: "#ffffff", width: 1.5, dash: "dash" }, fillcolor: "rgba(0,0,0,0)" }),
        ellipse(geom, { visible: editable, line: { color: "magenta", width: 2 }, fillcolor: "rgba(255, 0, 255, 0.18)" }),
      ].concat((a.static_voids || []).map(function (v) {
        // random arrangement: outline at the void's projection on the displayed plane, fainter the further
        // the void is from that plane (side = |sin theta|)
        const alpha = 1.0 - 0.75 * v.side;
        return { type: "circle", xref: "x", yref: "y", x0: v.x - v.rh, x1: v.x + v.rh, y0: v.depth, y1: v.depth + v.thick,
                 line: { color: "rgba(255, 0, 255, " + alpha.toFixed(2) + ")", width: 2 },
                 fillcolor: "rgba(255, 0, 255, " + (0.18 * alpha).toFixed(3) + ")" };
      })),
      dragmode: false,
      height: a.height, width: window.innerWidth, margin: { l: 60, r: 10, t: 20, b: 50 },
      plot_bgcolor: "#e8e8e8",
    };
    const config = { scrollZoom: false, displayModeBar: false, doubleClick: false, responsive: false };
    Plotly.react(gd, data, layout, config).then(function () { ready = true; });
    timebar.hidden = !res;
    if (res) { tslider.max = String(res.n - 1); tslider.value = String(cur); showTime(); }
    showInfo(geom);
  }

  // ---- mouse interaction ---------------------------------------------------------------------------------
  // Zone under the mouse: {col: 'l'|'c'|'r', row: 't'|'c'|'b'} inside the (enlarged) void box, else null.
  function zoneAt(clientX, clientY) {
    if (!ready || !editable || !gd._fullLayout) return null;
    const xa = gd._fullLayout.xaxis, ya = gd._fullLayout.yaxis, rect = gd.getBoundingClientRect();
    const px = clientX - rect.left - xa._offset, py = clientY - rect.top - ya._offset;
    const xs = [xa.d2p(geom.rc - geom.rh), xa.d2p(geom.rc + geom.rh)];
    const ys = [ya.d2p(geom.depth), ya.d2p(geom.depth + geom.thick)];
    const cx = (xs[0] + xs[1]) / 2, cy = (ys[0] + ys[1]) / 2;
    const w = Math.max(Math.abs(xs[1] - xs[0]), MIN_HIT), h = Math.max(Math.abs(ys[1] - ys[0]), MIN_HIT);
    const u = (px - cx) / w, v = (py - cy) / h;                   // -0.5 .. 0.5 inside the box
    if (Math.abs(u) > 0.5 || Math.abs(v) > 0.5) return null;
    return { col: u < -1 / 6 ? "l" : u > 1 / 6 ? "r" : "c", row: v < -1 / 6 ? "t" : v > 1 / 6 ? "b" : "c" };
  }

  function cursorClass(z) {
    if (!z) return null;
    if (z.col === "c" && z.row === "c") return "cur-move";
    if (z.row === "c") return "cur-ew";
    if (z.col === "c") return "cur-ns";
    return (z.col === "l") === (z.row === "t") ? "cur-nwse" : "cur-nesw";
  }
  function setCursor(cls) {
    gd.classList.remove("cur-move", "cur-ew", "cur-ns", "cur-nwse", "cur-nesw");
    if (cls) gd.classList.add(cls);
  }

  // Geometry for the active drag at mouse position (clientX, clientY): unclamped, updated live.
  function dragGeom(clientX, clientY) {
    const xa = gd._fullLayout.xaxis, ya = gd._fullLayout.yaxis;
    const ddx = xa.p2d(clientX) - xa.p2d(drag.x), ddy = ya.p2d(clientY) - ya.p2d(drag.y);   // px deltas → data
    const g0 = drag.g0, z = drag.zone;
    if (z.col === "c" && z.row === "c") return { rc: g0.rc + ddx, rh: g0.rh, depth: g0.depth + ddy, thick: g0.thick };
    let x0 = g0.rc - g0.rh, x1 = g0.rc + g0.rh, y0 = g0.depth, y1 = g0.depth + g0.thick;
    if (z.col === "l") x0 += ddx; else if (z.col === "r") x1 += ddx;
    if (z.row === "t") y0 += ddy; else if (z.row === "b") y1 += ddy;
    return { rc: (x0 + x1) / 2, rh: Math.abs(x1 - x0) / 2, depth: Math.min(y0, y1), thick: Math.abs(y1 - y0) };
  }

  // Live feedback during a drag: rewrite the existing SVG path of the shape directly (like Plotly's own
  // shape dragging does).  Going through Plotly.relayout on every mouse move leaves stale paths behind
  // for a frame (afterimages); the layout is updated once, on mouseup.
  function drawLive(g) {
    const path = gd.querySelector('.shapelayer .shape-group[data-index="' + VOID + '"] path');
    if (!path) return;
    const xa = gd._fullLayout.xaxis, ya = gd._fullLayout.yaxis;
    const x0 = xa._offset + xa.d2p(g.rc - g.rh), x1 = xa._offset + xa.d2p(g.rc + g.rh);
    const y0 = ya._offset + ya.d2p(g.depth), y1 = ya._offset + ya.d2p(g.depth + g.thick);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
    path.setAttribute("d", "M" + (cx - rx) + "," + cy + "a" + rx + "," + ry + " 0 1,0 " + (2 * rx) + ",0a" +
                           rx + "," + ry + " 0 1,0 " + (-2 * rx) + ",0Z");
  }

  gd.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    gd.focus({ preventScroll: true });                       // ← / → then step the snapshots
    const z = zoneAt(e.clientX, e.clientY);
    if (!z) return;
    e.preventDefault(); e.stopPropagation();
    drag = { zone: z, x: e.clientX, y: e.clientY, g0: Object.assign({}, geom) };
    setCursor(cursorClass(z));
  }, true);

  document.addEventListener("mousemove", function (e) {
    if (drag) { const g = dragGeom(e.clientX, e.clientY); drawLive(g); showInfo(clamp(g, args)); return; }
    setCursor(cursorClass(zoneAt(e.clientX, e.clientY)));
  });

  document.addEventListener("mouseup", function (e) {
    if (!drag) return;
    const g = clamp(dragGeom(e.clientX, e.clientY), args);
    drag = null;
    setCursor(cursorClass(zoneAt(e.clientX, e.clientY)));
    if (same(g, geom)) { Plotly.relayout(gd, shapeUpdate(geom)); showInfo(geom); return; }
    setGeometry(g);                                            // snaps the shape to the clamped / rounded values
  });

  // ---- snapshot selection --------------------------------------------------------------------------------
  tslider.addEventListener("input", function () { setFrame(parseInt(tslider.value, 10)); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    if (e.target === tslider || e.target.tagName === "INPUT" || !frames) return;   // slider steps by itself; fields move the caret
    e.preventDefault();
    setFrame(cur + (e.key === "ArrowRight" ? 1 : -1));
  });

  window.addEventListener("resize", function () { if (args) { Plotly.relayout(gd, { width: window.innerWidth }); showInfo(geom); } });
  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "streamlit:render") { args = e.data.args; render(); }
  });
  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
